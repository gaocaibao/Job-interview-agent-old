name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 后端（ruff + pytest）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -e "./backend[dev]"

      - name: ruff 静态检查
        run: ruff check backend

      - name: pytest 单元测试
        working-directory: backend
        run: pytest

  frontend:
    name: 前端（lint + build）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: eslint 检查
        working-directory: frontend
        run: npm run lint

      - name: 生产构建
        working-directory: frontend
        run: npm run build
